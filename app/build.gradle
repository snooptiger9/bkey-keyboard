plugins {
    id 'com.android.application'
}

// كلمة سر التوقيع صارت بـGitHub Secrets، مو بالمستودع إطلاقاً. ملف keystore.properties يُبنى
// تلقائياً وقت كل تشغيل CI من السر (.github/workflows/build.yml)، ولا يُحفظ أو يُرفع للمستودع
// (موجود بـ.gitignore). لو تبني محلياً على جهازك تحتاج تسوي الملف بنفسك بنفس الصيغة.
def keystorePropsFile = file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.bbgboard.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.bbgboard.keyboard"
        minSdk 24
        targetSdk 34
        // versionCode/versionName يتبعان نفس ترقيم vNNN اللي يُسلَّم بيه كل بناء (ظاهر بإعدادات أندرويد
        // > التطبيقات، حتى يطابق الرقم اللي يشوفه المستخدم عند كل نسخة جديدة بدون لخبطة بين الترقيمين).
        versionCode 183
        versionName "183.0"
    }

    signingConfigs {
        // مفتاح توقيع ثابت داخل المشروع نفسه (وليس مفتاح Debug العشوائي لجهازك)، حتى كل نسخة جديدة
        // ترسل لك تحدّث النسخة المثبتة فوق بعضها طبيعي بدون حذف ولا فقدان الكلمات المحفوظة والحافظة.
        bkeyStable {
            storeFile file('bkey_release.keystore')
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bkeyStable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.bkeyStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // لبناء ستايل اقتراحات الملء التلقائي (حساب/باسورد) داخل شريط الكيبورد بدل نافذة منبثقة
    implementation 'androidx.autofill:autofill:1.1.0'
    // لعرض وتشغيل صور GIF المتحركة بتبويب GIF
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
