plugins {
    id 'com.android.application'
}

def keystorePropsFile = file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.bbgboard.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.snooptiger9.bkey"
        minSdk 24
        targetSdk 34

        versionCode 243
        versionName "243.0"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["features"]
    productFlavors {
        lite {
            dimension "features"
            buildConfigField "boolean", "OTP_FEATURES_ENABLED", "false"
        }
        full {
            dimension "features"
            versionNameSuffix "-full"
            buildConfigField "boolean", "OTP_FEATURES_ENABLED", "true"
        }
    }

    signingConfigs {

        bkeyStable {
            storeFile file('bkey_release.keystore')
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bkeyStable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.bkeyStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // بعض الاعتمادات تجر نسخة قديمة منفصلة من kotlin-stdlib-jdk7/jdk8 بينما
    // androidx.core الحديثة تحتوي نفس الدوال مدمجة داخل kotlin-stdlib نفسها،
    // فيصير تعارض "Duplicate class" وقت البناء. استبعادهما يحل التعارض بأمان
    // لأن الدوال نفسها موجودة أصلاً داخل kotlin-stdlib.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {

    implementation 'androidx.core:core:1.13.1'

    implementation 'androidx.autofill:autofill:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
