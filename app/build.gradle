plugins {
    id 'com.android.application'
}

def keystorePropsFile = file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// KLIPY's production API key -- never committed. CI writes this file from a GitHub
// Actions secret (same pattern as keystore.properties above) as a single
// "KLIPY_API_KEY=..." line; a local dev build without the file just gets an empty
// key (GIF search won't work, everything else does).
def klipyPropsFile = file('klipy.properties')
def klipyProps = new Properties()
if (klipyPropsFile.exists()) {
    klipyProps.load(new FileInputStream(klipyPropsFile))
}

android {
    namespace 'com.bbgboard.keyboard'
    compileSdk 34

    // Keep the Google dependency-info block out of the signed APK (F-Droid/IzzyOnDroid scanners flag it).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig {
        applicationId "com.snooptiger9.bkey"
        minSdk 24
        targetSdk 34

        versionCode 307
        versionName "307.0"

        buildConfigField "String", "KLIPY_API_KEY", "\"${klipyProps.getProperty('KLIPY_API_KEY', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["features"]
    productFlavors {
        lite {
            dimension "features"
            buildConfigField "boolean", "OTP_FEATURES_ENABLED", "false"
        }
        full {
            dimension "features"
            versionNameSuffix "-full"
            buildConfigField "boolean", "OTP_FEATURES_ENABLED", "true"
        }
    }

    signingConfigs {

        bkeyStable {
            storeFile file('bkey_release.keystore')
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bkeyStable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.bkeyStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundles RELEASE_NOTES.md into the app so "What's new" works offline (no INTERNET needed).
def notesDir = layout.buildDirectory.dir('generated/release_notes')
def copyNotes = tasks.register('copyReleaseNotes', Copy) {
    from rootProject.file('RELEASE_NOTES.md')
    rename { 'release_notes.md' }
    into notesDir
}
android.sourceSets.main.assets.srcDir(notesDir)
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('Assets')) t.dependsOn(copyNotes)
}

configurations.all {
    // بعض الاعتمادات تجر نسخة قديمة منفصلة من kotlin-stdlib-jdk7/jdk8 بينما
    // androidx.core الحديثة تحتوي نفس الدوال مدمجة داخل kotlin-stdlib نفسها،
    // فيصير تعارض "Duplicate class" وقت البناء. استبعادهما يحل التعارض بأمان
    // لأن الدوال نفسها موجودة أصلاً داخل kotlin-stdlib.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {

    implementation 'androidx.core:core:1.13.1'

    implementation 'androidx.autofill:autofill:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
