name: Recover keystore password (one-time)

# Temporary and manual only. Encrypts the keystore password with a one-time public key
# so it can be read back once; the matching private key never leaves the maintainer.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encrypt the password with the one-time public key
        env:
          PW: ${{ secrets.BKEY_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$PW" | openssl pkeyutl -encrypt -pubin -inkey .github/recover/pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0 > .github/recover/password.enc

      - name: Commit the encrypted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/recover/password.enc
          git commit -m "Add encrypted file"
          git push
