name: Delete stale branch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/delete-branch.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the old experiment branch
        run: |
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete experiment/lite-no-internet || true
