name: Build signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bkey-release-apk
          path: app/build/outputs/apk/release/*.apk

      # نرفع ملف الـ APK الجاهز داخل المستودع نفسه (مجلد release/) بدل "Artifacts" التابعة لـ
      # GitHub (مخزّنة على سيرفرات تخزين منفصلة Claude ما يقدر يوصلها من بيئته الحالية).
      # هذا يخلي Claude يسحبها بـ git pull عادي، نفس قناة git المستخدمة أصلاً للرفع والتحميل.
      - name: Commit built APK into the repo
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/bkey-latest.apk
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/bkey-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "ci: update built APK [skip ci]"
            git push
          else
            echo "No APK changes to commit."
          fi
