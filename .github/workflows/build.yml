name: Build signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Write keystore.properties from secret
        env:
          BKEY_KEYSTORE_PASSWORD: ${{ secrets.BKEY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$BKEY_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret BKEY_KEYSTORE_PASSWORD غير موجود — أضفه من Settings > Secrets and variables > Actions"
            exit 1
          fi
          cat > app/keystore.properties <<EOF
          storePassword=$BKEY_KEYSTORE_PASSWORD
          keyAlias=bkeyalias
          keyPassword=$BKEY_KEYSTORE_PASSWORD
          EOF

      - name: Write signing keystore from secret
        env:
          BKEY_KEYSTORE_B64: ${{ secrets.BKEY_KEYSTORE_B64 }}
        run: |
          if [ -z "$BKEY_KEYSTORE_B64" ]; then
            echo "::error::Secret BKEY_KEYSTORE_B64 غير موجود — أضفه من Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$BKEY_KEYSTORE_B64" | base64 -d > app/bkey_release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs (lite + full)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build_output.log

      - name: Commit build log on failure
        if: failure()
        run: |
          mkdir -p release
          tail -c 200000 build_output.log > release/build_error.log
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/build_error.log
          git commit -m "ci: build error log [skip ci]" || true
          git push || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bkey-release-apks
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/full/release/*.apk

      - name: Check whether the app version changed
        id: verdiff
        run: |
          OLD_VERSION=""
          if [ -f release/bkey-latest.version ]; then
            OLD_VERSION=$(cat release/bkey-latest.version)
          fi
          NEW_VERSION=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit built APKs into the repo
        run: |
          mkdir -p release
          cp app/build/outputs/apk/lite/release/*.apk release/bkey-latest.apk
          cp app/build/outputs/apk/full/release/*.apk release/bkey-full-latest.apk
          grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle > release/bkey-latest.version
          cp release/bkey-latest.version release/bkey-full-latest.version
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/bkey-latest.apk release/bkey-full-latest.apk release/bkey-latest.version release/bkey-full-latest.version
          if ! git diff --cached --quiet; then
            git commit -m "ci: update built APKs [skip ci]"
            git push
          else
            echo "No APK changes to commit."
          fi

      - name: Read app version name
        id: appver
        run: echo "name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Lists what actually changed in the APP since the previous release, so
      # people reading the Release page see what's new for them to use --
      # not every commit in the repo. Only commits that touched app/ (real
      # source code) are listed; commits that only touched README.md, docs,
      # the CI workflow itself, etc. never affected the installed app, so
      # they'd just be noise here even though they're legitimate commits.
      # Needs the full git history (fetch-depth: 0 above) to find the
      # previous "v*" tag and everything committed after it.
      - name: Build changelog since the previous release
        id: changelog
        if: steps.verdiff.outputs.changed == 'true'
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          fi

          LOG=""
          while IFS= read -r sha; do
            if git diff-tree --no-commit-id --name-only -r "$sha" | grep -q '^app/'; then
              subject=$(git log -1 --pretty=format:'%s' "$sha")
              LOG="${LOG}- ${subject}"$'\n'
            fi
          done < <(git log $RANGE --no-merges --pretty=format:'%H')
          if [ -z "$LOG" ]; then
            LOG="- Minor fixes and improvements"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s' "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # bkey-latest.apk / bkey-full-latest.apk keep their fixed names so the
      # README's "releases/latest/download/..." links and the in-app updater
      # never need to change. These version-named copies are uploaded
      # alongside them on the Release page only, so a specific release's
      # assets are never confused with another version's (not committed into
      # the repo -- generated fresh for this run only).
      - name: Create version-named copies of the APKs for this release
        if: steps.verdiff.outputs.changed == 'true'
        run: |
          cp release/bkey-latest.apk "release/bkey-v${{ steps.verdiff.outputs.new }}.apk"
          cp release/bkey-full-latest.apk "release/bkey-full-v${{ steps.verdiff.outputs.new }}.apk"

      # Only cuts a new GitHub Release when versionCode actually changed, so the
      # per-asset download counters build up over time instead of resetting on
      # every ordinary commit (uploading new assets to an existing release would
      # reset their counts to zero).
      - name: Publish a new versioned GitHub Release
        if: steps.verdiff.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.appver.outputs.name }}"
          name: "v${{ steps.appver.outputs.name }}"
          body: ${{ steps.changelog.outputs.body }}
          make_latest: true
          files: |
            release/bkey-latest.apk
            release/bkey-full-latest.apk
            release/bkey-v${{ steps.verdiff.outputs.new }}.apk
            release/bkey-full-v${{ steps.verdiff.outputs.new }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
