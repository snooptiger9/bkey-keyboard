name: Build signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Write keystore.properties from secret
        env:
          BKEY_KEYSTORE_PASSWORD: ${{ secrets.BKEY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$BKEY_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret BKEY_KEYSTORE_PASSWORD غير موجود — أضفه من Settings > Secrets and variables > Actions"
            exit 1
          fi
          cat > app/keystore.properties <<EOF
          storePassword=$BKEY_KEYSTORE_PASSWORD
          keyAlias=bkeyalias
          keyPassword=$BKEY_KEYSTORE_PASSWORD
          EOF

      - name: Write signing keystore from secret
        env:
          BKEY_KEYSTORE_B64: ${{ secrets.BKEY_KEYSTORE_B64 }}
        run: |
          if [ -z "$BKEY_KEYSTORE_B64" ]; then
            echo "::error::Secret BKEY_KEYSTORE_B64 غير موجود — أضفه من Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$BKEY_KEYSTORE_B64" | base64 -d > app/bkey_release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs (lite + full)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build_output.log

      - name: Commit build log on failure
        if: failure()
        run: |
          mkdir -p release
          tail -c 200000 build_output.log > release/build_error.log
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/build_error.log
          git commit -m "ci: build error log [skip ci]" || true
          git push || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bkey-release-apks
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/full/release/*.apk

      - name: Commit built APKs into the repo
        run: |
          mkdir -p release
          cp app/build/outputs/apk/lite/release/*.apk release/bkey-latest.apk
          cp app/build/outputs/apk/full/release/*.apk release/bkey-full-latest.apk
          grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle > release/bkey-latest.version
          cp release/bkey-latest.version release/bkey-full-latest.version
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/bkey-latest.apk release/bkey-full-latest.apk release/bkey-latest.version release/bkey-full-latest.version
          if ! git diff --cached --quiet; then
            git commit -m "ci: update built APKs [skip ci]"
            git push
          else
            echo "No APK changes to commit."
          fi
