name: Build signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # كلمة سر التوقيع ما تُحفظ بالمستودع أبداً، تُجلب من GitHub Secrets وقت البناء فقط وتُكتب
      # بملف مؤقت على رنر CI (ما يصير commit له أبداً، يروح مع نهاية الـjob).
      - name: Write keystore.properties from secret
        env:
          BKEY_KEYSTORE_PASSWORD: ${{ secrets.BKEY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$BKEY_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret BKEY_KEYSTORE_PASSWORD غير موجود — أضفه من Settings > Secrets and variables > Actions"
            exit 1
          fi
          cat > app/keystore.properties <<EOF
          storePassword=$BKEY_KEYSTORE_PASSWORD
          keyAlias=bkeyalias
          keyPassword=$BKEY_KEYSTORE_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build_output.log

      # عند فشل البناء: نرفع سجل الخطأ داخل المستودع نفسه (بدل Artifacts المنفصلة)
      # حتى يسهل سحبه بـ git pull عادي ومعرفة سبب الفشل بالضبط.
      - name: Commit build log on failure
        if: failure()
        run: |
          mkdir -p release
          tail -c 200000 build_output.log > release/build_error.log
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/build_error.log
          git commit -m "ci: build error log [skip ci]" || true
          git push || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bkey-release-apk
          path: app/build/outputs/apk/release/*.apk

      # نرفع ملف الـ APK الجاهز داخل المستودع نفسه (مجلد release/) بدل "Artifacts" التابعة لـ
      # GitHub (مخزّنة على سيرفرات منفصلة)، حتى يسهل سحبها بـ git pull عادي، نفس قناة git
      # المستخدمة أصلاً للرفع والتحميل.
      - name: Commit built APK into the repo
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/bkey-latest.apk
          git config user.name "bkey-ci"
          git config user.email "ci@bkey.local"
          git add release/bkey-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "ci: update built APK [skip ci]"
            git push
          else
            echo "No APK changes to commit."
          fi
